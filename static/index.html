<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f97316;
      --orange-light: #fff7ed;
      --orange-dark: #ea6c0a;
      --green: #16a34a;
      --amber: #d97706;
      --grey: #6b7280;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      background: #fafafa;
      color: #111;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      background: var(--orange);
      color: #fff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 { font-size: 1.2rem; font-weight: 700; }

    .container { max-width: 680px; margin: 0 auto; padding: 1.25rem; }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input[type=url] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      font-size: 16px; /* prevents iOS auto-zoom */
      border: 1.5px solid #d1d5db;
      border-radius: var(--radius);
      outline: none;
    }

    input[type=url]:focus { border-color: var(--orange); }

    button {
      padding: 0.65rem 1.1rem;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: var(--orange-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: none;
      width: 36px; height: 36px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      color: #b91c1c;
      margin-bottom: 1rem;
    }

    /* Recipe card */
    .recipe-card { display: none; }

    .recipe-header { margin-bottom: 1rem; }

    #fixtureBar {
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--grey);
    }
    #fixtureBar a {
      color: var(--orange);
      cursor: pointer;
      text-decoration: none;
      margin-right: 0.6rem;
    }
    #fixtureBar a:hover { text-decoration: underline; }

    .recipe-description {
      color: #374151;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .source-url {
      font-size: 0.8rem;
      color: var(--grey);
      margin-bottom: 0.5rem;
      word-break: break-all;
    }
    .source-url a { color: var(--grey); }

    .recipe-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .chip {
      background: var(--orange-light);
      color: var(--orange-dark);
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .strategy-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .strategy-badge.schema  { background: #dcfce7; color: var(--green); }
    .strategy-badge.heuristic { background: #fef3c7; color: var(--amber); }

    .action-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: #fff;
      color: #374151;
      border: 1.5px solid #d1d5db;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .action-btn:hover { background: #f3f4f6; }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 1.25rem 0 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 2px solid var(--orange-light);
    }

    .ingredient-list { list-style: disc; padding-left: 1.4rem; }
    .ingredient-list li { margin-bottom: 0.25rem; }

    .step-list { list-style: none; padding: 0; }
    .step-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .step-badge {
      flex-shrink: 0;
      width: 1.8rem; height: 1.8rem;
      border-radius: 50%;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-heading {
      font-size: 1rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem;
      color: var(--grey);
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 8v4l3 3"/></svg>
  <h1>Recipe Extractor</h1>
</header>

<div class="container">
  <div class="input-row">
    <input type="url" id="urlInput" placeholder="Paste a recipe URL…" autocomplete="off">
    <button id="extractBtn">Get Recipe</button>
  </div>
  <div id="fixtureBar"></div>

  <div class="spinner" id="spinner"></div>
  <div class="error-box" id="errorBox"></div>
  <div class="recipe-card" id="recipeCard"></div>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const extractBtn = document.getElementById('extractBtn');
  const spinner = document.getElementById('spinner');
  const errorBox = document.getElementById('errorBox');
  const recipeCard = document.getElementById('recipeCard');

  // Copy plain text to clipboard (for raw markdown)
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  // Copy rich text / HTML to clipboard — pastes formatted into Apple Notes, Mail, etc.
  // Falls back to contenteditable + execCommand for older Safari (which supports
  // copying rich text via selection but not ClipboardItem).
  function copyRichText(html) {
    // Modern API: explicit HTML MIME type
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const blob = new Blob([html], { type: 'text/html' });
      return navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
    }
    // execCommand fallback: render into a hidden contenteditable, select, copy
    const div = document.createElement('div');
    div.contentEditable = 'true';
    div.style.cssText = 'position:fixed;opacity:0;top:0;left:0;pointer-events:none';
    div.innerHTML = html;
    document.body.appendChild(div);
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(div);
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    document.body.removeChild(div);
    return Promise.resolve();
  }

  // Build a clean HTML representation of the recipe for rich-text paste
  function recipeToHtml(data) {
    const s = data.schema;
    const lines = [];

    lines.push(`<h1>${esc(data.title)}</h1>`);

    // Meta
    const meta = [];
    if (s.author) meta.push('By ' + esc(Array.isArray(s.author) ? s.author.join(', ') : s.author));
    if (s.recipeYield) meta.push('Yield: ' + esc(s.recipeYield));
    if (s.prepTime)  meta.push('Prep: '  + parseDuration(s.prepTime));
    if (s.cookTime)  meta.push('Cook: '  + parseDuration(s.cookTime));
    if (s.totalTime) meta.push('Total: ' + parseDuration(s.totalTime));
    if (meta.length) lines.push(`<p>${meta.join(' · ')}</p>`);

    if (s.description) lines.push(`<p><em>${esc(s.description)}</em></p>`);

    // Category / cuisine / keywords
    const tags = [].concat(s.recipeCategory||[], s.recipeCuisine||[]);
    if (s.keywords) {
      const kw = s.keywords;
      if (Array.isArray(kw)) tags.push(...kw);
      else tags.push(...kw.split(',').map(k=>k.trim()).filter(Boolean));
    }
    if (tags.length) lines.push(`<p><strong>Tags:</strong> ${esc(tags.join(', '))}</p>`);

    // Ingredients
    if (s.recipeIngredient && s.recipeIngredient.length) {
      lines.push('<h2>Ingredients</h2>');
      lines.push('<ul>' + s.recipeIngredient.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>');
    }

    // Instructions
    const instructions = s.recipeInstructions || [];
    if (instructions.length) {
      lines.push('<h2>Instructions</h2>');
      const first = instructions[0];
      if (first && first['@type'] === 'HowToSection') {
        instructions.forEach(sec => {
          lines.push(`<h3>${esc(sec.name || 'Section')}</h3>`);
          const steps = (sec.itemListElement || []).map(step => {
            const t = typeof step === 'object' ? step.text : step;
            return `<li>${esc(t)}</li>`;
          });
          lines.push('<ol>' + steps.join('') + '</ol>');
        });
      } else {
        const steps = instructions.map(step => {
          const t = typeof step === 'object' ? (step.text||'') : step;
          return `<li>${esc(t)}</li>`;
        });
        lines.push('<ol>' + steps.join('') + '</ol>');
      }
    }

    // Nutrition
    const n = s.nutrition;
    if (n && typeof n === 'object') {
      const fields = [
        ['calories','Calories'],['carbohydrateContent','Carbs'],
        ['proteinContent','Protein'],['fatContent','Fat'],
        ['fiberContent','Fiber'],['sugarContent','Sugar'],
      ];
      const parts = fields.filter(([k])=>n[k]).map(([k,l])=>`${l}: ${esc(n[k])}`);
      if (parts.length) lines.push(`<p><strong>Nutrition:</strong> ${parts.join(' · ')}</p>`);
    }

    if (data.url && !data.url.startsWith('fixture://')) {
      lines.push(`<p><em>Source: <a href="${esc(data.url)}">${esc(data.url)}</a></em></p>`);
    }
    if (data.permalink) {
      lines.push(`<p><em>Permalink: <a href="${esc(data.permalink)}">${esc(data.permalink)}</a></em></p>`);
    }

    return lines.join('\n');
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    recipeCard.style.display = 'none';
    spinner.style.display = 'none';
  }

  function parseDuration(iso) {
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
    if (!m) return iso;
    const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0);
    const parts = [];
    if (h)   parts.push(h + ' hr');
    if (min) parts.push(min + ' min');
    return parts.join(' ') || iso;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderMeta(data) {
    const chips = [];
    const s = data.schema;
    if (s.author) {
      const name = Array.isArray(s.author) ? s.author.join(', ') : s.author;
      chips.push(name);
    }
    if (s.recipeYield) chips.push('Yield: ' + s.recipeYield);
    if (s.prepTime)   chips.push('Prep: ' + parseDuration(s.prepTime));
    if (s.cookTime)   chips.push('Cook: ' + parseDuration(s.cookTime));
    if (s.totalTime)  chips.push('Total: ' + parseDuration(s.totalTime));
    // Category and cuisine
    const cats = [].concat(s.recipeCategory || [], s.recipeCuisine || []);
    cats.forEach(c => chips.push(c));
    return chips.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  }

  function renderNutrition(n) {
    if (!n || typeof n !== 'object') return '';
    const fields = [
      ['calories','Calories'], ['carbohydrateContent','Carbs'],
      ['proteinContent','Protein'], ['fatContent','Fat'],
      ['fiberContent','Fiber'], ['sugarContent','Sugar'],
    ];
    const parts = fields.filter(([k]) => n[k]).map(([k, label]) =>
      `<span class="chip">${esc(label + ': ' + n[k])}</span>`
    ).join('');
    return parts ? `<div class="section-title">Nutrition</div><div class="meta-chips">${parts}</div>` : '';
  }

  function renderInstructions(instructions) {
    if (!instructions || !instructions.length) return '';
    const first = instructions[0];
    if (first && first['@type'] === 'HowToSection') {
      return instructions.map(sec => {
        const steps = (sec.itemListElement || []).map((step, i) => {
          const text = typeof step === 'object' ? step.text : step;
          return `<li><span class="step-badge">${i+1}</span><span>${esc(text)}</span></li>`;
        }).join('');
        return `<p class="section-heading">${esc(sec.name || 'Section')}</p><ol class="step-list">${steps}</ol>`;
      }).join('');
    }
    const steps = instructions.map((step, i) => {
      const text = typeof step === 'object' ? (step.text || '') : step;
      return `<li><span class="step-badge">${i+1}</span><span>${esc(text)}</span></li>`;
    }).join('');
    return `<ol class="step-list">${steps}</ol>`;
  }

  function renderRecipe(data) {
    const s = data.schema;
    const badgeClass = data.strategy === 'schema_org' ? 'schema' : 'heuristic';
    const badgeLabel = data.strategy === 'schema_org' ? '✓ Schema.org' : '⚙ Heuristic';

    const ings = (s.recipeIngredient || [])
      .map(i => `<li>${esc(i)}</li>`).join('');

    recipeCard.innerHTML = `
      <div class="recipe-header">
        <div class="recipe-title">${esc(data.title)}</div>
        ${data.url ? `<div class="source-url"><a href="${esc(data.url)}" target="_blank" rel="noopener">${esc(data.url)}</a></div>` : ''}
        <div class="meta-chips">
          ${renderMeta(data)}
          <span class="strategy-badge ${badgeClass}">${badgeLabel}</span>
        </div>
      </div>
      <div class="action-row">
        <button class="action-btn" id="copyNotesBtn">Copy for Notes</button>
        <button class="action-btn" id="copyMdBtn">Copy Markdown</button>
        <button class="action-btn" id="downloadBtn">Download JSON</button>
      </div>
      ${s.description ? `<p class="recipe-description">${esc(s.description)}</p>` : ''}
      ${ings ? `<div class="section-title">Ingredients</div><ul class="ingredient-list">${ings}</ul>` : ''}
      ${s.recipeInstructions ? `<div class="section-title">Instructions</div>${renderInstructions(s.recipeInstructions)}` : ''}
      ${renderNutrition(s.nutrition)}
    `;

    recipeCard.style.display = 'block';

    document.getElementById('copyNotesBtn').addEventListener('click', () => {
      const btn = document.getElementById('copyNotesBtn');
      copyRichText(recipeToHtml(data)).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy for Notes'; }, 2000);
      }).catch(() => {
        // Last-resort: fall back to plain markdown if rich text API unavailable
        copyText(data.markdown).then(() => {
          btn.textContent = 'Copied (markdown)';
          setTimeout(() => { btn.textContent = 'Copy for Notes'; }, 2500);
        });
      });
    });

    document.getElementById('copyMdBtn').addEventListener('click', () => {
      const btn = document.getElementById('copyMdBtn');
      const md = data.permalink
        ? data.markdown + '\n\n*Permalink: ' + data.permalink + '*'
        : data.markdown;
      copyText(md).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy Markdown'; }, 2000);
      });
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const slug = data.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug + '.json';
      a.click();
    });
  }

  // Fetch and render a recipe URL. Does NOT touch history — callers handle that.
  async function runExtract(url) {
    extractBtn.disabled = true;
    spinner.style.display = 'block';
    errorBox.style.display = 'none';
    recipeCard.style.display = 'none';

    try {
      const resp = await fetch('/extract?' + new URLSearchParams({url}));
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || `Server error ${resp.status}`);
      spinner.style.display = 'none';
      document.title = data.title + ' — Recipe Extractor';
      if (data.url && !data.url.startsWith('fixture://')) {
        data.permalink = window.location.origin + '/?url=' + encodeURIComponent(data.url);
      }
      renderRecipe(data);
    } catch (err) {
      showError(err.message || 'Extraction failed. Check the URL and try again.');
    } finally {
      extractBtn.disabled = false;
    }
  }

  // Called on explicit user submit: push permalink then extract.
  function submitUrl(url) {
    history.pushState({}, '', '?url=' + encodeURIComponent(url));
    runExtract(url);
  }

  extractBtn.addEventListener('click', () => {
    const url = urlInput.value.trim();
    if (url) submitUrl(url); else urlInput.focus();
  });
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const url = urlInput.value.trim(); if (url) submitUrl(url); }
  });

  // Back / forward navigation
  window.addEventListener('popstate', () => {
    const u = new URLSearchParams(location.search).get('url');
    if (u) {
      urlInput.value = u;
      runExtract(u);
    } else {
      urlInput.value = '';
      recipeCard.style.display = 'none';
      errorBox.style.display = 'none';
      document.title = 'Recipe Extractor';
    }
  });

  // Auto-load when arriving via a permalink (?url=…)
  (() => {
    const u = new URLSearchParams(location.search).get('url');
    if (u) { urlInput.value = u; runExtract(u); }
  })();

  // --- Fixture loader (dev) ---
  async function loadFixture(name) {
    extractBtn.disabled = true;
    spinner.style.display = 'block';
    errorBox.style.display = 'none';
    recipeCard.style.display = 'none';
    try {
      const resp = await fetch(`/fixture/${encodeURIComponent(name)}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || `Error ${resp.status}`);
      spinner.style.display = 'none';
      renderRecipe(data);
    } catch (err) {
      showError(err.message);
    } finally {
      extractBtn.disabled = false;
    }
  }

  // Probe /fixture/ for available fixtures; render links if any found
  (async () => {
    try {
      // hit a known-missing name to get the "available" list from the 404 detail
      const resp = await fetch('/fixture/__probe__');
      if (resp.status === 404) {
        const data = await resp.json();
        const available = data.detail?.match(/\[(.*?)\]/)?.[1]
          ?.split(',').map(s => s.trim().replace(/'/g, '').trim()).filter(Boolean) || [];
        if (available.length) {
          const bar = document.getElementById('fixtureBar');
          bar.innerHTML = 'Test fixtures: ' + available.map(n =>
            `<a onclick="loadFixture('${n}')">${n}</a>`
          ).join('');
        }
      }
    } catch (_) { /* no fixtures dir or server not running */ }
  })();
</script>
</body>
</html>

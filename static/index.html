<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f97316;
      --orange-light: #fff7ed;
      --orange-dark: #ea6c0a;
      --green: #16a34a;
      --amber: #d97706;
      --grey: #6b7280;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      background: #fafafa;
      color: #111;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      background: var(--orange);
      color: #fff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 { font-size: 1.2rem; font-weight: 700; }

    .container { max-width: 680px; margin: 0 auto; padding: 1.25rem; }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input[type=url] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      font-size: 16px; /* prevents iOS auto-zoom */
      border: 1.5px solid #d1d5db;
      border-radius: var(--radius);
      outline: none;
    }

    input[type=url]:focus { border-color: var(--orange); }

    button {
      padding: 0.65rem 1.1rem;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: var(--orange-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: none;
      width: 36px; height: 36px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      color: #b91c1c;
      margin-bottom: 1rem;
    }

    /* Recipe card */
    .recipe-card { display: none; }

    .recipe-header { margin-bottom: 1rem; }

    #fixtureBar {
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--grey);
    }
    #fixtureBar a {
      color: var(--orange);
      cursor: pointer;
      text-decoration: none;
      margin-right: 0.6rem;
    }
    #fixtureBar a:hover { text-decoration: underline; }

    .recipe-description {
      color: #374151;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .source-url {
      font-size: 0.8rem;
      color: var(--grey);
      margin-bottom: 0.5rem;
      word-break: break-all;
    }
    .source-url a { color: var(--grey); }

    .recipe-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .chip {
      background: var(--orange-light);
      color: var(--orange-dark);
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .strategy-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .strategy-badge.schema  { background: #dcfce7; color: var(--green); }
    .strategy-badge.heuristic { background: #fef3c7; color: var(--amber); }

    .action-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: #fff;
      color: #374151;
      border: 1.5px solid #d1d5db;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .action-btn:hover { background: #f3f4f6; }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 1.25rem 0 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 2px solid var(--orange-light);
    }

    .ingredient-list { list-style: disc; padding-left: 1.4rem; }
    .ingredient-list li { margin-bottom: 0.25rem; }

    .step-list { list-style: none; padding: 0; }
    .step-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .step-badge {
      flex-shrink: 0;
      width: 1.8rem; height: 1.8rem;
      border-radius: 50%;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-heading {
      font-size: 1rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem;
      color: var(--grey);
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 8v4l3 3"/></svg>
  <h1>Recipe Extractor</h1>
</header>

<div class="container">
  <div class="input-row">
    <input type="url" id="urlInput" placeholder="Paste a recipe URL…" autocomplete="off">
    <button id="extractBtn">Get Recipe</button>
  </div>
  <div id="fixtureBar"></div>

  <div class="spinner" id="spinner"></div>
  <div class="error-box" id="errorBox"></div>
  <div class="recipe-card" id="recipeCard"></div>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const extractBtn = document.getElementById('extractBtn');
  const spinner = document.getElementById('spinner');
  const errorBox = document.getElementById('errorBox');
  const recipeCard = document.getElementById('recipeCard');

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // execCommand fallback for older Safari
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    recipeCard.style.display = 'none';
    spinner.style.display = 'none';
  }

  function parseDuration(iso) {
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
    if (!m) return iso;
    const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0);
    const parts = [];
    if (h)   parts.push(h + ' hr');
    if (min) parts.push(min + ' min');
    return parts.join(' ') || iso;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderMeta(data) {
    const chips = [];
    const s = data.schema;
    if (s.author) {
      const name = Array.isArray(s.author) ? s.author.join(', ') : s.author;
      chips.push(name);
    }
    if (s.recipeYield) chips.push('Yield: ' + s.recipeYield);
    if (s.prepTime)   chips.push('Prep: ' + parseDuration(s.prepTime));
    if (s.cookTime)   chips.push('Cook: ' + parseDuration(s.cookTime));
    if (s.totalTime)  chips.push('Total: ' + parseDuration(s.totalTime));
    // Category and cuisine
    const cats = [].concat(s.recipeCategory || [], s.recipeCuisine || []);
    cats.forEach(c => chips.push(c));
    return chips.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  }

  function renderNutrition(n) {
    if (!n || typeof n !== 'object') return '';
    const fields = [
      ['calories','Calories'], ['carbohydrateContent','Carbs'],
      ['proteinContent','Protein'], ['fatContent','Fat'],
      ['fiberContent','Fiber'], ['sugarContent','Sugar'],
    ];
    const parts = fields.filter(([k]) => n[k]).map(([k, label]) =>
      `<span class="chip">${esc(label + ': ' + n[k])}</span>`
    ).join('');
    return parts ? `<div class="section-title">Nutrition</div><div class="meta-chips">${parts}</div>` : '';
  }

  function renderInstructions(instructions) {
    if (!instructions || !instructions.length) return '';
    const first = instructions[0];
    if (first && first['@type'] === 'HowToSection') {
      return instructions.map(sec => {
        const steps = (sec.itemListElement || []).map((step, i) => {
          const text = typeof step === 'object' ? step.text : step;
          return `<li><span class="step-badge">${i+1}</span><span>${esc(text)}</span></li>`;
        }).join('');
        return `<p class="section-heading">${esc(sec.name || 'Section')}</p><ol class="step-list">${steps}</ol>`;
      }).join('');
    }
    const steps = instructions.map((step, i) => {
      const text = typeof step === 'object' ? (step.text || '') : step;
      return `<li><span class="step-badge">${i+1}</span><span>${esc(text)}</span></li>`;
    }).join('');
    return `<ol class="step-list">${steps}</ol>`;
  }

  function renderRecipe(data) {
    const s = data.schema;
    const badgeClass = data.strategy === 'schema_org' ? 'schema' : 'heuristic';
    const badgeLabel = data.strategy === 'schema_org' ? '✓ Schema.org' : '⚙ Heuristic';

    const ings = (s.recipeIngredient || [])
      .map(i => `<li>${esc(i)}</li>`).join('');

    recipeCard.innerHTML = `
      <div class="recipe-header">
        <div class="recipe-title">${esc(data.title)}</div>
        ${data.url ? `<div class="source-url"><a href="${esc(data.url)}" target="_blank" rel="noopener">${esc(data.url)}</a></div>` : ''}
        <div class="meta-chips">
          ${renderMeta(data)}
          <span class="strategy-badge ${badgeClass}">${badgeLabel}</span>
        </div>
      </div>
      <div class="action-row">
        <button class="action-btn" id="copyBtn">Copy for Notes</button>
        <button class="action-btn" id="downloadBtn">Download JSON</button>
      </div>
      ${s.description ? `<p class="recipe-description">${esc(s.description)}</p>` : ''}
      ${ings ? `<div class="section-title">Ingredients</div><ul class="ingredient-list">${ings}</ul>` : ''}
      ${s.recipeInstructions ? `<div class="section-title">Instructions</div>${renderInstructions(s.recipeInstructions)}` : ''}
      ${renderNutrition(s.nutrition)}
    `;

    recipeCard.style.display = 'block';

    document.getElementById('copyBtn').addEventListener('click', () => {
      copyToClipboard(data.markdown).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy for Notes'; }, 2000);
      });
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const slug = data.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug + '.json';
      a.click();
    });
  }

  async function doExtract() {
    const url = urlInput.value.trim();
    if (!url) { urlInput.focus(); return; }

    extractBtn.disabled = true;
    spinner.style.display = 'block';
    errorBox.style.display = 'none';
    recipeCard.style.display = 'none';

    try {
      const resp = await fetch('/extract', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url}),
      });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.detail || `Server error ${resp.status}`);
      }
      spinner.style.display = 'none';
      renderRecipe(data);
    } catch (err) {
      showError(err.message || 'Extraction failed. Check the URL and try again.');
    } finally {
      extractBtn.disabled = false;
    }
  }

  extractBtn.addEventListener('click', doExtract);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') doExtract(); });

  // --- Fixture loader (dev) ---
  async function loadFixture(name) {
    extractBtn.disabled = true;
    spinner.style.display = 'block';
    errorBox.style.display = 'none';
    recipeCard.style.display = 'none';
    try {
      const resp = await fetch(`/fixture/${encodeURIComponent(name)}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || `Error ${resp.status}`);
      spinner.style.display = 'none';
      renderRecipe(data);
    } catch (err) {
      showError(err.message);
    } finally {
      extractBtn.disabled = false;
    }
  }

  // Probe /fixture/ for available fixtures; render links if any found
  (async () => {
    try {
      // hit a known-missing name to get the "available" list from the 404 detail
      const resp = await fetch('/fixture/__probe__');
      if (resp.status === 404) {
        const data = await resp.json();
        const available = data.detail?.match(/\[(.*?)\]/)?.[1]
          ?.split(',').map(s => s.trim().replace(/'/g, '').trim()).filter(Boolean) || [];
        if (available.length) {
          const bar = document.getElementById('fixtureBar');
          bar.innerHTML = 'Test fixtures: ' + available.map(n =>
            `<a onclick="loadFixture('${n}')">${n}</a>`
          ).join('');
        }
      }
    } catch (_) { /* no fixtures dir or server not running */ }
  })();
</script>
</body>
</html>
